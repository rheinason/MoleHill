name: Feature request
description: Suggest something MoleHill should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How you picture it working. If another tool (Civil 3D, Vectorworks, ...) does it well, say how.
  - type: textarea
    id: context
    attributes:
      label: Anything else
